<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="robots" content="noindex, nofollow">

  <title>Admin Panel | Shivam Imitation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #003d37;
      color: #fff;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1000px;
      margin: auto;
      padding: 25px 16px 50px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      margin: 0;
      color: #f3d77b;
      font-size: 30px;
    }

    .logo p {
      color: #ddd;
      margin: 7px 0 0;
    }

    .card {
      background: #002f2b;
      border: 1px solid rgba(231, 189, 85, .4);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, .25);
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 0;
      color: #f3d77b;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: 600;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid rgba(231, 189, 85, .35);
      background: #003d37;
      color: #fff;
      outline: none;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    select option {
      background: #003d37;
      color: white;
    }

    input[type="file"] {
      padding: 10px;
    }

    button {
      border: none;
      border-radius: 9px;
      background: #e7bd55;
      color: #002f2b;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      padding: 12px 16px;
    }

    button:hover {
      background: #f3d77b;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .main-button {
      width: 100%;
      margin-top: 20px;
    }

    .logout {
      width: 100%;
      margin-top: 12px;
      background: transparent;
      color: #f3d77b;
      border: 1px solid #e7bd55;
    }

    .message {
      display: none;
      margin-top: 16px;
      padding: 13px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      word-break: break-word;
    }

    .success {
      display: block;
      background: rgba(50, 180, 100, .18);
      color: #9ff0bd;
    }

    .error {
      display: block;
      background: rgba(220, 60, 60, .18);
      color: #ffaaaa;
    }

    .info {
      display: block;
      background: rgba(231, 189, 85, .12);
      color: #f3d77b;
    }

    .login-panel {
      max-width: 600px;
      margin: auto;
    }

    .admin-panel {
      display: none;
    }

    .status {
      margin-bottom: 18px;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      background: rgba(50, 180, 100, .12);
      color: #9ff0bd;
    }

    .upload-box {
      border: 1px dashed rgba(231, 189, 85, .6);
      padding: 15px;
      border-radius: 12px;
      margin-top: 5px;
    }

    .small {
      color: #aebbb8;
      font-size: 13px;
      margin-top: 7px;
      line-height: 1.5;
    }

    .preview {
      display: none;
      text-align: center;
      margin-top: 15px;
    }

    .preview img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #e7bd55;
    }

    .next-name {
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(231, 189, 85, .1);
      color: #f3d77b;
      text-align: center;
      font-size: 14px;
    }

    .progress-box {
      display: none;
      margin-top: 15px;
    }

    .progress-bar-bg {
      width: 100%;
      height: 10px;
      background: #003d37;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #e7bd55;
      transition: width .2s;
    }

    .progress-text {
      text-align: center;
      margin-top: 7px;
      color: #f3d77b;
      font-size: 13px;
    }

    .url-box {
      display: none;
      margin-top: 12px;
      padding: 10px;
      border-radius: 8px;
      background: rgba(50, 180, 100, .1);
      color: #9ff0bd;
      font-size: 12px;
      word-break: break-all;
    }

    .form-buttons {
      display: flex;
      gap: 10px;
    }

    .form-buttons button {
      flex: 1;
    }

    .cancel-button {
      background: transparent;
      color: #f3d77b;
      border: 1px solid #e7bd55;
    }

    /* PRODUCTS */

    .products-title {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 15px;
    }

    .products-title h2 {
      margin: 0;
    }

    .refresh-btn {
      padding: 9px 14px;
      font-size: 13px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .product-card {
      background: #003d37;
      border: 1px solid rgba(231, 189, 85, .25);
      border-radius: 14px;
      overflow: hidden;
    }

    .product-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
    }

    .product-info {
      padding: 14px;
    }

    .product-category {
      color: #f3d77b;
      font-size: 12px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .product-info h3 {
      margin: 7px 0;
      font-size: 17px;
    }

    .product-price {
      color: #f3d77b;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .product-description {
      color: #c9d4d1;
      font-size: 13px;
      line-height: 1.4;
      min-height: 38px;
    }

    .product-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    .edit-btn {
      flex: 1;
      background: #e7bd55;
    }

    .delete-btn {
      flex: 1;
      background: #b83b3b;
      color: white;
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: #aebbb8;
    }

    .loading {
      padding: 30px;
      text-align: center;
      color: #f3d77b;
    }

    @media (max-width: 800px) {
      .products-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 550px) {
      .container {
        padding: 18px 12px 40px;
      }

      .card {
        padding: 18px;
      }

      .products-grid {
        grid-template-columns: 1fr;
      }

      .product-card img {
        height: 260px;
      }

      .form-buttons {
        flex-direction: column;
      }

      .products-title {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">
    <h1>SHIVAM IMITATION</h1>
    <p>Admin Product Panel</p>
  </div>

  <!-- LOGIN -->

  <div id="loginPanel" class="card login-panel">

    <h2>🔐 Admin Login</h2>

    <label>Email</label>

    <input
      type="email"
      id="loginEmail"
      placeholder="Enter admin email"
      autocomplete="email">

    <label>Password</label>

    <input
      type="password"
      id="loginPassword"
      placeholder="Enter password"
      autocomplete="current-password">

    <button
      id="loginButton"
      class="main-button"
      onclick="loginAdmin()">

      🔐 Login

    </button>

    <div id="loginMessage" class="message"></div>

  </div>


  <!-- ADMIN -->

  <div id="adminPanel" class="admin-panel">

    <div class="card">

      <div class="status">
        ✅ Admin logged in
      </div>

      <h2 id="formTitle">
        ➕ Add New Product
      </h2>


      <label>
        Product Name *
      </label>

      <input
        type="text"
        id="productName"
        placeholder="Example: Royal Green Drop Set">


      <label>
        Price *
      </label>

      <input
        type="number"
        id="productPrice"
        placeholder="Example: 599"
        min="0">


      <label>
        Category *
      </label>

      <select id="productCategory">

        <option value="">
          Select Category
        </option>

        <option value="Necklaces">
          Necklaces
        </option>

        <option value="Bridal">
          Bridal
        </option>

        <option value="Traditional">
          Traditional
        </option>

        <option value="Daily Wear">
          Daily Wear
        </option>

        <option value="Bracelets">
          Bracelets
        </option>

        <option value="Novelties">
          Novelties
        </option>

      </select>


      <label>
        Description *
      </label>

      <textarea
        id="productDescription"
        placeholder="Example: Premium imitation jewellery">
      </textarea>


      <label>
        Product Image
      </label>

      <div class="upload-box">

        <input
          type="file"
          id="productImage"
          accept="image/jpeg,image/png,image/webp">

        <div class="small">
          📷 New product હોય ત્યારે image પસંદ કરો.
          <br>
          ✏️ Edit કરતી વખતે image બદલવી હોય તો જ નવી image પસંદ કરો.
          <br>
          Maximum size: 5 MB.
        </div>

      </div>


      <div
        id="nextProductName"
        class="next-name">

        📁 Checking next image number...

      </div>


      <div
        id="imagePreview"
        class="preview">

        <img
          id="previewImage"
          src=""
          alt="Preview">

      </div>


      <div
        id="progressBox"
        class="progress-box">

        <div class="progress-bar-bg">

          <div
            id="progressBar"
            class="progress-bar">
          </div>

        </div>

        <div
          id="progressText"
          class="progress-text">

          Preparing...

        </div>

      </div>


      <div
        id="urlBox"
        class="url-box">
      </div>


      <div class="form-buttons">

        <button
          id="saveButton"
          onclick="saveProduct()">

          ➕ Add Product

        </button>

        <button
          id="cancelButton"
          class="cancel-button"
          onclick="cancelEdit()"
          style="display:none;">

          Cancel Edit

        </button>

      </div>


      <button
        class="logout"
        onclick="logoutAdmin()">

        Logout

      </button>


      <div
        id="productMessage"
        class="message">
      </div>

    </div>


    <!-- ALL PRODUCTS -->

    <div class="card">

      <div class="products-title">

        <h2>
          📦 All Products
        </h2>

        <button
          class="refresh-btn"
          onclick="loadProducts()">

          🔄 Refresh

        </button>

      </div>

      <div
        id="productsList"
        class="products-grid">

        <div class="loading">
          Loading products...
        </div>

      </div>

    </div>

  </div>

</div>


<script type="module">

  /* =====================================================
     FIREBASE IMPORTS
  ===================================================== */

  import {
    initializeApp
  }
  from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


  import {
    getAuth,
    signInWithEmailAndPassword,
    onAuthStateChanged,
    signOut
  }
  from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


  import {
    getFirestore,
    collection,
    addDoc,
    getDocs,
    doc,
    updateDoc,
    deleteDoc,
    serverTimestamp
  }
  from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


  /* =====================================================
     FIREBASE CONFIG
  ===================================================== */

  const firebaseConfig = {

    apiKey:
      "AIzaSyDEbDU7EnS8f0k5o6nRSxGSl-X7k9Uz2A4",

    authDomain:
      "shivam-imitation.firebaseapp.com",

    projectId:
      "shivam-imitation",

    storageBucket:
      "shivam-imitation.firebasestorage.app",

    messagingSenderId:
      "625171137884",

    appId:
      "1:625171137884:web:d1928af5e11fad077e6d99",

    measurementId:
      "G-ER1ETZSLPD"

  };


  /* =====================================================
     WORKER
  ===================================================== */

  const WORKER_URL =
    "https://shivam-image-upload-api.dhruviljarsaniya030.workers.dev/";


  /* =====================================================
     ADMIN
  ===================================================== */

  const ADMIN_EMAIL =
    "dhruviljarsaniya030@gmail.com";


  /* =====================================================
     INITIALIZE
  ===================================================== */

  const app =
    initializeApp(firebaseConfig);

  const auth =
    getAuth(app);

  const db =
    getFirestore(app);


  /* =====================================================
     EDIT STATE
  ===================================================== */

  let editingProductId = null;

  let editingOldImage = "";

  let editingOldImageName = "";


  /* =====================================================
     MESSAGE
  ===================================================== */

  function showMessage(
    id,
    text,
    type
  ) {

    const el =
      document.getElementById(id);

    if (!el) return;

    el.textContent =
      text;

    el.className =
      "message " + type;

  }


  /* =====================================================
     LOGIN
  ===================================================== */

  window.loginAdmin =
    async function () {

      const email =
        document
          .getElementById("loginEmail")
          .value
          .trim();

      const password =
        document
          .getElementById("loginPassword")
          .value;

      const button =
        document.getElementById("loginButton");


      if (!email || !password) {

        showMessage(
          "loginMessage",
          "Please enter email and password.",
          "error"
        );

        return;

      }


      if (
        email.toLowerCase() !==
        ADMIN_EMAIL.toLowerCase()
      ) {

        showMessage(
          "loginMessage",
          "This email is not authorized.",
          "error"
        );

        return;

      }


      try {

        button.disabled = true;

        button.textContent =
          "Logging in...";


        await signInWithEmailAndPassword(
          auth,
          email,
          password
        );


      }

      catch (error) {

        console.error(error);

        showMessage(
          "loginMessage",
          "❌ " +
          (
            error.message ||
            "Login failed."
          ),
          "error"
        );

      }

      finally {

        button.disabled = false;

        button.textContent =
          "🔐 Login";

      }

    };


  /* =====================================================
     AUTH STATE
  ===================================================== */

  onAuthStateChanged(
    auth,
    async function (user) {

      const login =
        document.getElementById(
          "loginPanel"
        );

      const admin =
        document.getElementById(
          "adminPanel"
        );


      if (
        user &&
        user.email &&
        user.email.toLowerCase() ===
        ADMIN_EMAIL.toLowerCase()
      ) {

        login.style.display =
          "none";

        admin.style.display =
          "block";

        await findNextProductNumber();

        await loadProducts();

      }

      else {

        login.style.display =
          "block";

        admin.style.display =
          "none";

      }

    }
  );


  /* =====================================================
     LOGOUT
  ===================================================== */

  window.logoutAdmin =
    async function () {

      await signOut(auth);

    };


  /* =====================================================
     FIND NEXT IMAGE NUMBER
  ===================================================== */

  async function findNextProductNumber() {

    try {

      const snapshot =
        await getDocs(
          collection(
            db,
            "products"
          )
        );


      let highest =
        10;


      snapshot.forEach(
        function (item) {

          const data =
            item.data();

          const imageName =
            data.imageName ||
            "";


          const match =
            String(imageName)
              .match(
                /product-(\d+)/i
              );


          if (match) {

            const number =
              Number(match[1]);

            if (
              number > highest
            ) {

              highest = number;

            }

          }

        }
      );


      const next =
        highest + 1;


      window.nextProductNumber =
        next;


      document.getElementById(
        "nextProductName"
      ).textContent =
        "📁 Next image: product-" +
        next +
        ".jpg";

    }

    catch (error) {

      console.error(error);

      window.nextProductNumber =
        11;

    }

  }


  /* =====================================================
     IMAGE PREVIEW
  ===================================================== */

  document
    .getElementById("productImage")
    .addEventListener(
      "change",
      function () {

        const file =
          this.files[0];

        const preview =
          document.getElementById(
            "imagePreview"
          );

        const image =
          document.getElementById(
            "previewImage"
          );


        if (!file) {

          preview.style.display =
            "none";

          return;

        }


        const allowed = [

          "image/jpeg",
          "image/png",
          "image/webp"

        ];


        if (
          !allowed.includes(
            file.type
          )
        ) {

          this.value = "";

          preview.style.display =
            "none";

          showMessage(
            "productMessage",
            "❌ JPG, PNG or WEBP only.",
            "error"
          );

          return;

        }


        if (
          file.size >
          5 * 1024 * 1024
        ) {

          this.value = "";

          preview.style.display =
            "none";

          showMessage(
            "productMessage",
            "❌ Image must be smaller than 5 MB.",
            "error"
          );

          return;

        }


        image.src =
          URL.createObjectURL(file);

        preview.style.display =
          "block";

      }
    );


  /* =====================================================
     UPLOAD IMAGE
  ===================================================== */

  async function uploadImageToWorker(
    file
  ) {

    const formData =
      new FormData();


    formData.append(
      "image",
      file
    );


    const response =
      await fetch(
        WORKER_URL,
        {
          method: "POST",
          body: formData
        }
      );


    let result;

    try {

      result =
        await response.json();

    }

    catch {

      throw new Error(
        "Worker returned invalid response."
      );

    }


    if (
      !response.ok ||
      !result.success
    ) {

      throw new Error(
        result.message ||
        "Image upload failed."
      );

    }


    return result;

  }


  /* =====================================================
     SAVE PRODUCT
  ===================================================== */

  window.saveProduct =
    async function () {

      const name =
        document
          .getElementById("productName")
          .value
          .trim();

      const priceText =
        document
          .getElementById("productPrice")
          .value
          .trim();

      const category =
        document
          .getElementById("productCategory")
          .value
          .trim();

      const description =
        document
          .getElementById("productDescription")
          .value
          .trim();

      const imageInput =
        document.getElementById(
          "productImage"
        );

      const file =
        imageInput.files[0];

      const button =
        document.getElementById(
          "saveButton"
        );


      /* VALIDATION */

      if (
        !name ||
        !priceText ||
        !category ||
        !description
      ) {

        showMessage(
          "productMessage",
          "⚠️ Please fill all product details.",
          "error"
        );

        return;

      }


      if (
        editingProductId === null &&
        !file
      ) {

        showMessage(
          "productMessage",
          "⚠️ Please select product image.",
          "error"
        );

        return;

      }


      const price =
        Number(priceText);


      if (
        Number.isNaN(price) ||
        price < 0
      ) {

        showMessage(
          "productMessage",
          "⚠️ Enter a valid price.",
          "error"
        );

        return;

      }


      try {

        button.disabled = true;

        button.textContent =
          editingProductId
            ? "Updating..."
            : "Uploading...";


        document.getElementById(
          "progressBox"
        ).style.display =
          "block";


        document.getElementById(
          "progressBar"
        ).style.width =
          "10%";


        let imageURL =
          editingOldImage;

        let imageName =
          editingOldImageName;


        /* NEW IMAGE */

        if (file) {

          document.getElementById(
            "progressText"
          ).textContent =
            "📷 Uploading image...";


          const result =
            await uploadImageToWorker(
              file
            );


          imageURL =
            result.image;

          imageName =
            result.fileName;


          document.getElementById(
            "progressBar"
          ).style.width =
            "70%";


          document.getElementById(
            "urlBox"
          ).textContent =
            imageURL;

          document.getElementById(
            "urlBox"
          ).style.display =
            "block";

        }


        const productData = {

          name:
            name,

          price:
            price,

          category:
            category,

          description:
            description,

          image:
            imageURL,

          imageName:
            imageName

        };


        /* EDIT */

        if (
          editingProductId
        ) {

          await updateDoc(
            doc(
              db,
              "products",
              editingProductId
            ),
            productData
          );


          showMessage(
            "productMessage",
            "✅ Product updated successfully!",
            "success"
          );

        }


        /* ADD */

        else {

          productData.createdAt =
            serverTimestamp();


          const ref =
            await addDoc(
              collection(
                db,
                "products"
              ),
              productData
            );


          console.log(
            "Added:",
            ref.id
          );


          showMessage(
            "productMessage",
            "✅ Product added successfully!",
            "success"
          );

        }


        resetForm();

        await findNextProductNumber();

        await loadProducts();


        document.getElementById(
          "progressBar"
        ).style.width =
          "100%";


        document.getElementById(
          "progressText"
        ).textContent =
          "✅ Complete";


      }

      catch (error) {

        console.error(
          "SAVE ERROR:",
          error
        );


        showMessage(
          "productMessage",
          "❌ " +
          (
            error.message ||
            "Operation failed."
          ),
          "error"
        );

      }

      finally {

        button.disabled = false;

        button.textContent =
          editingProductId
            ? "Update Product"
            : "➕ Add Product";

      }

    };


  /* =====================================================
     LOAD ALL PRODUCTS
  ===================================================== */

  window.loadProducts =
    async function () {

      const container =
        document.getElementById(
          "productsList"
        );


      container.innerHTML =
        `<div class="loading">
          Loading all Firebase products...
        </div>`;


      try {

        const snapshot =
          await getDocs(
            collection(
              db,
              "products"
            )
          );


        container.innerHTML = "";


        if (
          snapshot.empty
        ) {

          container.innerHTML =
            `<div class="empty">
              No products found in Firebase.
            </div>`;

          return;

        }


        snapshot.forEach(
          function (item) {

            const data =
              item.data();


            const id =
              item.id;


            const name =
              data.name ||
              "Unnamed Product";


            const price =
              data.price ?? "";


            const category =
              data.category ||
              "Jewellery";


            const description =
              data.description ||
              "";


            const image =
              data.image ||
              "logo.jpg";


            const card =
              document.createElement(
                "div"
              );


            card.className =
              "product-card";


            card.innerHTML = `

              <img
                src="${escapeHTML(image)}"
                alt="${escapeHTML(name)}"
                loading="lazy"
              >

              <div class="product-info">

                <div class="product-category">
                  ${escapeHTML(category)}
                </div>

                <h3>
                  ${escapeHTML(name)}
                </h3>

                <div class="product-price">
                  ₹${escapeHTML(price)}
                </div>

                <div class="product-description">
                  ${escapeHTML(description)}
                </div>

                <div class="product-actions">

                  <button
                    class="edit-btn"
                    data-id="${escapeHTML(id)}">

                    ✏️ Edit

                  </button>

                  <button
                    class="delete-btn"
                    data-id="${escapeHTML(id)}">

                    🗑️ Delete

                  </button>

                </div>

              </div>

            `;


            /* EDIT */

            card
              .querySelector(".edit-btn")
              .addEventListener(
                "click",
                function () {

                  editProduct(
                    id,
                    data
                  );

                }
              );


            /* DELETE */

            card
              .querySelector(".delete-btn")
              .addEventListener(
                "click",
                function () {

                  deleteProduct(
                    id,
                    name
                  );

                }
              );


            container.appendChild(
              card
            );

          }
        );

      }

      catch (error) {

        console.error(
          "LOAD PRODUCTS ERROR:",
          error
        );


        container.innerHTML =
          `<div class="empty">
            ❌ Products could not be loaded.<br><br>
            ${escapeHTML(error.message)}
          </div>`;

      }

    };


  /* =====================================================
     EDIT PRODUCT
  ===================================================== */

  function editProduct(
    id,
    data
  ) {

    editingProductId =
      id;

    editingOldImage =
      data.image ||
      "";

    editingOldImageName =
      data.imageName ||
      "";


    document.getElementById(
      "formTitle"
    ).textContent =
      "✏️ Edit Product";


    document.getElementById(
      "saveButton"
    ).textContent =
      "Update Product";


    document.getElementById(
      "cancelButton"
    ).style.display =
      "block";


    document.getElementById(
      "productName"
    ).value =
      data.name ||
      "";


    document.getElementById(
      "productPrice"
    ).value =
      data.price ??
      "";


    document.getElementById(
      "productCategory"
    ).value =
      data.category ||
      "";


    document.getElementById(
      "productDescription"
    ).value =
      data.description ||
      "";


    document.getElementById(
      "productImage"
    ).value =
      "";


    const preview =
      document.getElementById(
        "imagePreview"
      );

    const previewImage =
      document.getElementById(
        "previewImage"
      );


    if (
      data.image
    ) {

      previewImage.src =
        data.image;

      preview.style.display =
        "block";

    }


    document
      .querySelector(".card")
      .scrollIntoView({
        behavior: "smooth"
      });


    showMessage(
      "productMessage",
      "✏️ Editing: " +
      (data.name || "Product"),
      "info"
    );

  }


  /* =====================================================
     DELETE PRODUCT
  ===================================================== */

  async function deleteProduct(
    id,
    name
  ) {

    const confirmed =
      confirm(
        "Delete this product?\n\n" +
        name +
        "\n\nThis will remove the product from Firebase and the website."
      );


    if (!confirmed) {
      return;
    }


    try {

      await deleteDoc(
        doc(
          db,
          "products",
          id
        )
      );


      showMessage(
        "productMessage",
        "🗑️ Product deleted successfully.",
        "success"
      );


      await loadProducts();

      await findNextProductNumber();

    }

    catch (error) {

      console.error(
        "DELETE ERROR:",
        error
      );


      showMessage(
        "productMessage",
        "❌ Delete failed: " +
        (
          error.message ||
          ""
        ),
        "error"
      );

    }

  }


  /* =====================================================
     CANCEL EDIT
  ===================================================== */

  window.cancelEdit =
    function () {

      resetForm();

      showMessage(
        "productMessage",
        "Edit cancelled.",
        "info"
      );

    };


  /* =====================================================
     RESET FORM
  ===================================================== */

  function resetForm() {

    editingProductId =
      null;

    editingOldImage =
      "";

    editingOldImageName =
      "";


    document.getElementById(
      "formTitle"
    ).textContent =
      "➕ Add New Product";


    document.getElementById(
      "saveButton"
    ).textContent =
      "➕ Add Product";


    document.getElementById(
      "cancelButton"
    ).style.display =
      "none";


    document.getElementById(
      "productName"
    ).value =
      "";


    document.getElementById(
      "productPrice"
    ).value =
      "";


    document.getElementById(
      "productCategory"
    ).value =
      "";


    document.getElementById(
      "productDescription"
    ).value =
      "";


    document.getElementById(
      "productImage"
    ).value =
      "";


    document.getElementById(
      "imagePreview"
    ).style.display =
      "none";


    document.getElementById(
      "urlBox"
    ).style.display =
      "none";


    document.getElementById(
      "progressBox"
    ).style.display =
      "none";


    document.getElementById(
      "progressBar"
    ).style.width =
      "0%";

  }


  /* =====================================================
     ESCAPE HTML
  ===================================================== */

  function escapeHTML(
    value
  ) {

    return String(value)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );

  }


  console.log(
    "Shivam Imitation Admin Panel Ready"
  );

</script>
