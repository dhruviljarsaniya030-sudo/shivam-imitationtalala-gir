<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">

  <title>Admin Panel | Shivam Imitation</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #003d37;
      color: #fff;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 1100px;
      margin: auto;
      padding: 25px 16px 50px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo h1 {
      margin: 0;
      color: #f3d77b;
      font-size: 30px;
    }

    .logo p {
      margin: 6px 0;
      color: #ddd;
    }

    .card {
      background: #002f2b;
      border: 1px solid rgba(231, 189, 85, .4);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, .25);
      margin-bottom: 25px;
    }

    h2 {
      margin-top: 0;
      color: #f3d77b;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: 600;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border-radius: 9px;
      border: 1px solid rgba(231, 189, 85, .35);
      background: #003d37;
      color: #fff;
      outline: none;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    select option {
      background: #003d37;
      color: #fff;
    }

    input[type="file"] {
      padding: 10px;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 13px;
      border: none;
      border-radius: 9px;
      background: #e7bd55;
      color: #002f2b;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #f3d77b;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .logout {
      background: transparent;
      color: #f3d77b;
      border: 1px solid #e7bd55;
    }

    .cancel {
      background: #444;
      color: white;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      font-weight: 600;
      word-break: break-word;
    }

    .success {
      display: block;
      background: rgba(50, 180, 100, .18);
      color: #9ff0bd;
    }

    .error {
      display: block;
      background: rgba(220, 60, 60, .18);
      color: #ffaaaa;
    }

    .info {
      display: block;
      background: rgba(231, 189, 85, .12);
      color: #f3d77b;
    }

    .login-panel {
      max-width: 650px;
      margin: auto;
    }

    .admin-panel {
      display: none;
    }

    .products-panel {
      display: none;
    }

    .status {
      margin-bottom: 18px;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
      background: rgba(50, 180, 100, .12);
      color: #9ff0bd;
    }

    .upload-box {
      border: 1px dashed rgba(231, 189, 85, .6);
      padding: 15px;
      border-radius: 12px;
      margin-top: 5px;
      background: rgba(0, 61, 55, .5);
    }

    .preview {
      margin-top: 15px;
      text-align: center;
      display: none;
    }

    .preview img {
      width: 180px;
      height: 180px;
      object-fit: cover;
      border-radius: 12px;
      border: 1px solid #e7bd55;
    }

    .small {
      color: #aebbb8;
      font-size: 13px;
      margin-top: 7px;
      line-height: 1.5;
    }

    .progress-box {
      display: none;
      margin-top: 15px;
    }

    .progress-bg {
      height: 10px;
      background: #003d37;
      border-radius: 20px;
      overflow: hidden;
    }

    .progress {
      width: 0%;
      height: 100%;
      background: #e7bd55;
      transition: .2s;
    }

    .products-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .products-header h2 {
      margin: 0;
    }

    .count {
      color: #f3d77b;
      font-size: 14px;
    }

    .search {
      margin: 18px 0;
    }

    .product-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
    }

    .product-card {
      background: #003d37;
      border: 1px solid rgba(231, 189, 85, .25);
      border-radius: 14px;
      overflow: hidden;
    }

    .product-card img {
      width: 100%;
      height: 230px;
      object-fit: cover;
      display: block;
      background: #111;
    }

    .product-info {
      padding: 15px;
    }

    .product-info h3 {
      margin: 0 0 8px;
      color: #f3d77b;
      font-size: 20px;
    }

    .product-category {
      color: #aaa;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .product-price {
      font-size: 18px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .product-description {
      color: #c5cfcc;
      font-size: 13px;
      line-height: 1.5;
      min-height: 40px;
    }

    .product-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .edit-btn {
      background: #e7bd55;
    }

    .delete-btn {
      background: #9b3030;
      color: white;
    }

    .empty {
      padding: 30px;
      text-align: center;
      color: #bbb;
      border: 1px dashed rgba(231, 189, 85, .4);
      border-radius: 12px;
    }

    .editing {
      border: 2px solid #f3d77b;
    }

    @media(max-width:800px) {
      .product-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media(max-width:550px) {
      .container {
        padding: 18px 10px 40px;
      }

      .card {
        padding: 18px;
      }

      .product-list {
        grid-template-columns: 1fr;
      }

      .product-card img {
        height: 280px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      <h1>SHIVAM IMITATION</h1>
      <p>Admin Product Panel</p>
    </div>


    <!-- LOGIN -->

    <div id="loginPanel" class="card login-panel">

      <h2>🔐 Admin Login</h2>

      <label>Email</label>

      <input
        type="email"
        id="loginEmail"
        placeholder="Enter admin email">

      <label>Password</label>

      <input
        type="password"
        id="loginPassword"
        placeholder="Enter password">

      <button
        id="loginButton"
        onclick="loginAdmin()">

        🔐 Login

      </button>

      <div id="loginMessage" class="message"></div>

    </div>


    <!-- ADMIN -->

    <div id="adminPanel" class="admin-panel">


      <!-- ADD / EDIT -->

      <div id="formCard" class="card">

        <div class="status">
          ✅ Admin logged in
        </div>

        <h2 id="formTitle">
          ➕ Add New Product
        </h2>


        <label>Product Name *</label>

        <input
          type="text"
          id="productName"
          placeholder="Example: Royal Green Drop Set">


        <label>Price *</label>

        <input
          type="number"
          id="productPrice"
          placeholder="Example: 599"
          min="0">


        <label>Category *</label>

        <select id="productCategory">

          <option value="">Select Category</option>

          <option value="Necklaces">Necklaces</option>

          <option value="Bridal">Bridal</option>

          <option value="Traditional">Traditional</option>

          <option value="Daily Wear">Daily Wear</option>

          <option value="Bracelets">Bracelets</option>

          <option value="Novelties">Novelties</option>

        </select>


        <label>Description *</label>

        <textarea
          id="productDescription"
          placeholder="Example: Premium imitation jewellery"></textarea>


        <label>Product Image</label>

        <div class="upload-box">

          <input
            type="file"
            id="productImage"
            accept="image/jpeg,image/png,image/webp">

          <div class="small">
            New product માટે photo select કરો.
            Edit વખતે photo બદલવી હોય ત્યારે જ photo પસંદ કરો.
          </div>

        </div>


        <div id="imagePreview" class="preview">

          <img id="previewImage" src="" alt="Preview">

        </div>


        <div id="progressBox" class="progress-box">

          <div class="progress-bg">

            <div
              id="progressBar"
              class="progress">
            </div>

          </div>

        </div>


        <button
          id="saveButton"
          onclick="saveProduct()">

          ➕ Add Product

        </button>


        <button
          id="cancelButton"
          class="cancel"
          onclick="cancelEdit()"
          style="display:none">

          Cancel Edit

        </button>


        <div
          id="productMessage"
          class="message">
        </div>

      </div>


      <!-- PRODUCTS -->

      <div class="card products-panel" id="productsPanel">

        <div class="products-header">

          <h2>
            📦 All Products
          </h2>

          <div
            id="productCount"
            class="count">

            Loading...

          </div>

        </div>


        <input
          id="searchProducts"
          class="search"
          type="text"
          placeholder="🔎 Search product..."
          oninput="filterProducts()">


        <div
          id="productList"
          class="product-list">

          <div class="empty">
            Loading all Firebase products...
          </div>

        </div>

      </div>


      <div class="card">

        <button
          class="logout"
          onclick="logoutAdmin()">

          Logout

        </button>

      </div>

    </div>

  </div>


  <script type="module">

    import {
      initializeApp
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";


    import {
      getAuth,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      updateDoc,
      deleteDoc,
      doc,
      serverTimestamp
    } from
    "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /* FIREBASE */

    const firebaseConfig = {

      apiKey:
        "AIzaSyDEbDU7EnS8f0k5o6nRSxGSl-X7k9Uz2A4",

      authDomain:
        "shivam-imitation.firebaseapp.com",

      projectId:
        "shivam-imitation",

      storageBucket:
        "shivam-imitation.firebasestorage.app",

      messagingSenderId:
        "625171137884",

      appId:
        "1:625171137884:web:d1928af5e11fad077e6d99",

      measurementId:
        "G-ER1ETZSLPD"

    };


    /* WORKER */

    const WORKER_URL =
      "https://shivam-image-upload-api.dhruviljarsaniya030.workers.dev/";


    /* ADMIN */

    const ADMIN_EMAIL =
      "dhruviljarsaniya030@gmail.com";


    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    let allProducts = [];

    let editingProductId = null;

    let editingOldImage = "";


    /* MESSAGE */

    function showMessage(id, text, type) {

      const el =
        document.getElementById(id);

      el.textContent = text;

      el.className =
        "message " + type;

    }


    /* LOGIN */

    window.loginAdmin =
      async function() {

        const email =
          document.getElementById(
            "loginEmail"
          ).value.trim();

        const password =
          document.getElementById(
            "loginPassword"
          ).value;

        const button =
          document.getElementById(
            "loginButton"
          );


        if (!email || !password) {

          showMessage(
            "loginMessage",
            "Please enter email and password.",
            "error"
          );

          return;

        }


        if (
          email.toLowerCase() !==
          ADMIN_EMAIL.toLowerCase()
        ) {

          showMessage(
            "loginMessage",
            "This email is not authorized.",
            "error"
          );

          return;

        }


        try {

          button.disabled = true;

          button.textContent =
            "Logging in...";


          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


          showMessage(
            "loginMessage",
            "Login successful!",
            "success"
          );

        }

        catch(error) {

          console.error(error);

          showMessage(
            "loginMessage",
            "❌ " +
            (error.message || "Login failed."),
            "error"
          );

        }

        finally {

          button.disabled = false;

          button.textContent =
            "🔐 Login";

        }

      };


    /* AUTH */

    onAuthStateChanged(
      auth,
      function(user) {

        const login =
          document.getElementById(
            "loginPanel"
          );

        const admin =
          document.getElementById(
            "adminPanel"
          );

        const productsPanel =
          document.getElementById(
            "productsPanel"
          );


        if (
          user &&
          user.email &&
          user.email.toLowerCase() ===
          ADMIN_EMAIL.toLowerCase()
        ) {

          login.style.display =
            "none";

          admin.style.display =
            "block";

          productsPanel.style.display =
            "block";


          loadAllProducts();

        }

        else {

          login.style.display =
            "block";

          admin.style.display =
            "none";

          productsPanel.style.display =
            "none";

        }

      }
    );


    /* LOAD ALL FIREBASE PRODUCTS */

    async function loadAllProducts() {

      const list =
        document.getElementById(
          "productList"
        );


      list.innerHTML =
        '<div class="empty">Loading all Firebase products...</div>';


      try {

        const snapshot =
          await getDocs(
            collection(
              db,
              "products"
            )
          );


        allProducts = [];


        snapshot.forEach(
          function(item) {

            allProducts.push({

              id: item.id,

              ...item.data()

            });

          }
        );


        console.log(
          "ALL FIREBASE PRODUCTS:",
          allProducts
        );


        renderProducts(
          allProducts
        );

      }

      catch(error) {

        console.error(
          "LOAD PRODUCTS ERROR:",
          error
        );


        list.innerHTML = `
          <div class="empty">
            ❌ Products load failed.<br><br>
            ${error.message || ""}
          </div>
        `;

      }

    }


    /* RENDER */

    function renderProducts(products) {

      const list =
        document.getElementById(
          "productList"
        );

      const count =
        document.getElementById(
          "productCount"
        );


      count.textContent =
        products.length +
        " product(s)";


      list.innerHTML = "";


      if (!products.length) {

        list.innerHTML = `
          <div class="empty">
            No products found.
          </div>
        `;

        return;

      }


      products.forEach(
        function(product) {

          const card =
            document.createElement(
              "div"
            );


          card.className =
            "product-card";


          const image =
            product.image ||
            "logo.jpg";


          const name =
            product.name ||
            "Unnamed Product";


          const price =
            product.price !== undefined
              ? product.price
              : "";


          const category =
            product.category ||
            "Jewellery";


          const description =
            product.description ||
            "";


          card.innerHTML = `

            <img
              src="${escapeHTML(image)}"
              alt="${escapeHTML(name)}"
              onerror="this.src='logo.jpg'">

            <div class="product-info">

              <h3>
                ${escapeHTML(name)}
              </h3>

              <div class="product-category">
                📂 ${escapeHTML(category)}
              </div>

              <div class="product-price">
                ₹${escapeHTML(price)}
              </div>

              <div class="product-description">
                ${escapeHTML(description)}
              </div>

              <div class="product-buttons">

                <button
                  class="edit-btn"
                  type="button">

                  ✏️ Edit

                </button>

                <button
                  class="delete-btn"
                  type="button">

                  🗑️ Delete

                </button>

              </div>

            </div>
          `;


          card
            .querySelector(".edit-btn")
            .addEventListener(
              "click",
              function() {

                editProduct(
                  product
                );

              }
            );


          card
            .querySelector(".delete-btn")
            .addEventListener(
              "click",
              function() {

                deleteProduct(
                  product
                );

              }
            );


          list.appendChild(card);

        }
      );

    }


    /* ESCAPE */

    function escapeHTML(value) {

      return String(value ?? "")

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /* SEARCH */

    window.filterProducts =
      function() {

        const search =
          document.getElementById(
            "searchProducts"
          ).value
            .toLowerCase()
            .trim();


        if (!search) {

          renderProducts(
            allProducts
          );

          return;

        }


        const filtered =
          allProducts.filter(
            function(product) {

              return (

                String(
                  product.name || ""
                )
                  .toLowerCase()
                  .includes(search)

                ||

                String(
                  product.category || ""
                )
                  .toLowerCase()
                  .includes(search)

                ||

                String(
                  product.description || ""
                )
                  .toLowerCase()
                  .includes(search)

              );

            }
          );


        renderProducts(
          filtered
        );

      };


    /* IMAGE PREVIEW */

    document
      .getElementById(
        "productImage"
      )
      .addEventListener(
        "change",
        function() {

          const file =
            this.files[0];


          if (!file) return;


          if (
            ![
              "image/jpeg",
              "image/jpg",
              "image/png",
              "image/webp"
            ].includes(file.type)
          ) {

            this.value = "";

            showMessage(
              "productMessage",
              "❌ Only JPG, PNG or WEBP allowed.",
              "error"
            );

            return;

          }


          if (
            file.size >
            5 * 1024 * 1024
          ) {

            this.value = "";

            showMessage(
              "productMessage",
              "❌ Image must be smaller than 5 MB.",
              "error"
            );

            return;

          }


          const preview =
            document.getElementById(
              "imagePreview"
            );

          const image =
            document.getElementById(
              "previewImage"
            );


          image.src =
            URL.createObjectURL(file);


          preview.style.display =
            "block";

        }
      );


    /* UPLOAD IMAGE */

    async function uploadImage(file) {

      const formData =
        new FormData();


      formData.append(
        "image",
        file
      );


      const response =
        await fetch(
          WORKER_URL,
          {
            method: "POST",
            body: formData
          }
        );


      let result;


      try {

        result =
          await response.json();

      }

      catch {

        throw new Error(
          "Worker returned invalid response."
        );

      }


      if (
        !response.ok ||
        !result.success
      ) {

        throw new Error(
          result.message ||
          "Image upload failed."
        );

      }


      return result;

    }


    /* SAVE PRODUCT */

    window.saveProduct =
      async function() {

        const name =
          document.getElementById(
            "productName"
          ).value.trim();


        const priceText =
          document.getElementById(
            "productPrice"
          ).value.trim();


        const category =
          document.getElementById(
            "productCategory"
          ).value.trim();


        const description =
          document.getElementById(
            "productDescription"
          ).value.trim();


        const imageInput =
          document.getElementById(
            "productImage"
          );


        const file =
          imageInput.files[0];


        const button =
          document.getElementById(
            "saveButton"
          );


        if (
          !name ||
          !priceText ||
          !category ||
          !description
        ) {

          showMessage(
            "productMessage",
            "⚠️ Please fill all required details.",
            "error"
          );

          return;

        }


        const price =
          Number(priceText);


        if (
          Number.isNaN(price) ||
          price < 0
        ) {

          showMessage(
            "productMessage",
            "⚠️ Enter a valid price.",
            "error"
          );

          return;

        }


        try {

          button.disabled = true;


          let imageURL =
            editingOldImage;


          let imageName =
            "";


          /* NEW IMAGE */

          if (file) {

            showMessage(
              "productMessage",
              "📷 Uploading image...",
              "info"
            );


            document.getElementById(
              "progressBox"
            ).style.display =
              "block";


            document.getElementById(
              "progressBar"
            ).style.width =
              "50%";


            const result =
              await uploadImage(
                file
              );


            imageURL =
              result.image;


            imageName =
              result.fileName || "";

          }


          /* ADD */

          if (!editingProductId) {

            if (!imageURL) {

              throw new Error(
                "Please select a product image."
              );

            }


            await addDoc(
              collection(
                db,
                "products"
              ),
              {

                name:
                  name,

                price:
                  price,

                category:
                  category,

                description:
                  description,

                image:
                  imageURL,

                imageName:
                  imageName,

                createdAt:
                  serverTimestamp()

              }
            );


            showMessage(
              "productMessage",
              "✅ Product added successfully!",
              "success"
            );

          }


          /* EDIT */

          else {

            const updateData = {

              name:
                name,

              price:
                price,

              category:
                category,

              description:
                description

            };


            if (imageURL) {

              updateData.image =
                imageURL;

            }


            if (imageName) {

              updateData.imageName =
                imageName;

            }


            await updateDoc(
              doc(
                db,
                "products",
                editingProductId
              ),
              updateData
            );


            showMessage(
              "productMessage",
              "✅ Product updated successfully!",
              "success"
            );

          }


          cancelEdit();


          await loadAllProducts();

        }

        catch(error) {

          console.error(
            "SAVE ERROR:",
            error
          );


          showMessage(
            "productMessage",
            "❌ " +
            (
              error.message ||
              "Save failed."
            ),
            "error"
          );

        }

        finally {

          button.disabled = false;

          document.getElementById(
            "progressBox"
          ).style.display =
            "none";

        }

      };


    /* EDIT */

    window.editProduct =
      function(product) {

        editingProductId =
          product.id;


        editingOldImage =
          product.image ||
          "";


        document.getElementById(
          "productName"
        ).value =
          product.name || "";


        document.getElementById(
          "productPrice"
        ).value =
          product.price ?? "";


        document.getElementById(
          "productCategory"
        ).value =
          product.category || "";


        document.getElementById(
          "productDescription"
        ).value =
          product.description || "";


        document.getElementById(
          "productImage"
        ).value =
          "";


        document.getElementById(
          "formTitle"
        ).textContent =
          "✏️ Edit Product";


        document.getElementById(
          "saveButton"
        ).textContent =
          "💾 Update Product";


        document.getElementById(
          "cancelButton"
        ).style.display =
          "block";


        if (product.image) {

          document.getElementById(
            "previewImage"
          ).src =
            product.image;


          document.getElementById(
            "imagePreview"
          ).style.display =
            "block";

        }


        document
          .getElementById(
            "formCard"
          )
          .scrollIntoView({
            behavior: "smooth"
          });


        showMessage(
          "productMessage",
          "✏️ Editing: " +
          (product.name || "Product"),
          "info"
        );

      };


    /* CANCEL EDIT */

    window.cancelEdit =
      function() {

        editingProductId =
          null;


        editingOldImage =
          "";


        document.getElementById(
          "productName"
        ).value =
          "";


        document.getElementById(
          "productPrice"
        ).value =
          "";


        document.getElementById(
          "productCategory"
        ).value =
          "";


        document.getElementById(
          "productDescription"
        ).value =
          "";


        document.getElementById(
          "productImage"
        ).value =
          "";


        document.getElementById(
          "imagePreview"
        ).style.display =
          "none";


        document.getElementById(
          "formTitle"
        ).textContent =
          "➕ Add New Product";


        document.getElementById(
          "saveButton"
        ).textContent =
          "➕ Add Product";


        document.getElementById(
          "cancelButton"
        ).style.display =
          "none";

      };


    /* DELETE */

    window.deleteProduct =
      async function(product) {

        const name =
          product.name ||
          "this product";


        const confirmDelete =
          confirm(
            "🗑️ Delete " +
            name +
            "?\n\nThis will remove the product from Firebase."
          );


        if (!confirmDelete) {

          return;

        }


        try {

          await deleteDoc(
            doc(
              db,
              "products",
              product.id
            )
          );


          showMessage(
            "productMessage",
            "✅ Product deleted: " +
            name,
            "success"
          );


          await loadAllProducts();

        }

        catch(error) {

          console.error(
            "DELETE ERROR:",
            error
          );


          showMessage(
            "productMessage",
            "❌ Delete failed: " +
            (
              error.message ||
              ""
            ),
            "error"
          );

        }

      };


    /* LOGOUT */

    window.logoutAdmin =
      async function() {

        await signOut(
          auth
        );

      };


    console.log(
      "Shivam Imitation Admin Panel Loaded"
    );

  </script>

</body>
</html>
